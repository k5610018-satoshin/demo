<script>
// ---------------------------------------------------------------------------
// 状態管理
// ---------------------------------------------------------------------------
var currentName  = '';
var mediaRecorder = null;
var audioChunks  = [];
var audioBlob    = null;
var audioStream  = null;
var timerInterval = null;
var startTime    = 0;
var analyser     = null;
var animationId  = null;

// ---------------------------------------------------------------------------
// 初期化
// ---------------------------------------------------------------------------
window.addEventListener('DOMContentLoaded', function() {
  // localStorage から名前を復元
  var saved = localStorage.getItem('studentName');
  if (saved) {
    currentName = saved;
    showMainScreen();
  } else {
    loadNameList();
  }
});

// ---------------------------------------------------------------------------
// 名前入力画面
// ---------------------------------------------------------------------------
function loadNameList() {
  google.script.run
    .withSuccessHandler(function(names) {
      if (names && names.length > 0) {
        var container = document.getElementById('nameButtons');
        container.innerHTML = '';
        names.forEach(function(n) {
          var btn = document.createElement('button');
          btn.className = 'btn btn-name';
          btn.textContent = n;
          btn.onclick = function() {
            document.getElementById('nameInput').value = n;
            enterApp();
          };
          container.appendChild(btn);
        });
        show('nameList');
      }
    })
    .getStudentNames();
}

function enterApp() {
  var name = document.getElementById('nameInput').value.trim();
  if (!name) {
    document.getElementById('nameInput').focus();
    return;
  }
  currentName = name;
  localStorage.setItem('studentName', name);
  showMainScreen();
}

function showMainScreen() {
  document.getElementById('displayName').textContent = currentName + ' さん';
  hide('nameScreen');
  show('mainScreen');
}

function changeName() {
  localStorage.removeItem('studentName');
  currentName = '';
  hide('mainScreen');
  document.getElementById('nameInput').value = '';
  show('nameScreen');
  loadNameList();
}

// ---------------------------------------------------------------------------
// タブ切り替え
// ---------------------------------------------------------------------------
function switchTab(tab) {
  if (tab === 'record') {
    document.getElementById('tabRecord').classList.add('active');
    document.getElementById('tabReview').classList.remove('active');
    show('recordTab');
    hide('reviewTab');
  } else {
    document.getElementById('tabReview').classList.add('active');
    document.getElementById('tabRecord').classList.remove('active');
    hide('recordTab');
    show('reviewTab');
    loadReviews();
  }
}

// ---------------------------------------------------------------------------
// 振り返り一覧
// ---------------------------------------------------------------------------
function loadReviews() {
  show('reviewLoading');
  hide('reviewEmpty');
  hide('reviewList');

  google.script.run
    .withSuccessHandler(renderReviews)
    .withFailureHandler(function(err) {
      hide('reviewLoading');
      show('reviewEmpty');
      document.querySelector('#reviewEmpty p').textContent = 'エラー: ' + err.message;
    })
    .getRecordsByStudent(currentName);
}

function renderReviews(records) {
  hide('reviewLoading');

  if (!records || records.length === 0) {
    show('reviewEmpty');
    return;
  }

  var container = document.getElementById('reviewList');
  container.innerHTML = '';

  // 日付ごとにグループ化
  var grouped = {};
  var dateOrder = [];
  records.forEach(function(r) {
    if (!grouped[r.dateLabel]) {
      grouped[r.dateLabel] = [];
      dateOrder.push(r.dateLabel);
    }
    grouped[r.dateLabel].push(r);
  });

  dateOrder.forEach(function(dateLabel) {
    // 日付ヘッダー
    var dateHeader = document.createElement('div');
    dateHeader.className = 'review-date-header';
    dateHeader.textContent = dateLabel;
    container.appendChild(dateHeader);

    // その日の各録音カード
    grouped[dateLabel].forEach(function(r) {
      var card = document.createElement('div');
      card.className = 'review-card';
      card.innerHTML =
        '<div class="review-card-time">' + escapeHtml(r.timeLabel) + '</div>' +
        '<div class="review-card-text">' + escapeHtml(r.transcript) + '</div>' +
        '<div class="review-card-actions">' +
          '<a href="' + escapeHtml(r.fileUrl) + '" target="_blank" class="review-link">音声を聞く</a>' +
        '</div>';
      container.appendChild(card);
    });
  });

  show('reviewList');
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str || ''));
  return div.innerHTML;
}

// ---------------------------------------------------------------------------
// 録音開始
// ---------------------------------------------------------------------------
function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
      audioStream = stream;
      audioChunks = [];

      var options = { mimeType: 'audio/webm;codecs=opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'audio/webm' };
      }
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = {};
      }
      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        showPreview();
      };

      mediaRecorder.start(250);

      document.getElementById('btnRecord').disabled = true;
      document.getElementById('btnStop').disabled   = false;
      document.getElementById('timer').classList.add('recording');
      hideRecordSections();

      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 200);
      setupVisualizer(stream);
    })
    .catch(function(err) {
      showError('マイクへのアクセスが許可されませんでした: ' + err.message);
    });
}

// ---------------------------------------------------------------------------
// 録音停止
// ---------------------------------------------------------------------------
function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  stopStream();
  clearInterval(timerInterval);
  cancelAnimationFrame(animationId);

  document.getElementById('btnRecord').disabled = false;
  document.getElementById('btnStop').disabled   = true;
  document.getElementById('timer').classList.remove('recording');
}

function stopStream() {
  if (audioStream) {
    audioStream.getTracks().forEach(function(t) { t.stop(); });
    audioStream = null;
  }
}

// ---------------------------------------------------------------------------
// プレビュー表示
// ---------------------------------------------------------------------------
function showPreview() {
  var url = URL.createObjectURL(audioBlob);
  document.getElementById('audioPreview').src = url;
  show('previewSection');
}

// ---------------------------------------------------------------------------
// 音声送信
// ---------------------------------------------------------------------------
function submitAudio() {
  hide('previewSection');
  show('loadingSection');

  var reader = new FileReader();
  reader.onloadend = function() {
    var base64   = reader.result.split(',')[1];
    var mimeType = audioBlob.type.split(';')[0];
    var fileName = 'recording_' + formatTimestamp(new Date()) + '.webm';

    google.script.run
      .withSuccessHandler(onSubmitSuccess)
      .withFailureHandler(onSubmitError)
      .processAudio({
        audioBase64: base64,
        mimeType: mimeType,
        fileName: fileName,
        studentName: currentName
      });
  };
  reader.readAsDataURL(audioBlob);
}

function onSubmitSuccess(result) {
  hide('loadingSection');
  document.getElementById('transcriptText').textContent = result.transcript;
  document.getElementById('fileLink').href = result.fileUrl;

  google.script.run
    .withSuccessHandler(function(url) {
      document.getElementById('sheetLink').href = url;
    })
    .getSpreadsheetUrl();

  show('resultSection');
}

function onSubmitError(err) {
  hide('loadingSection');
  showError('処理中にエラーが発生しました: ' + err.message);
}

// ---------------------------------------------------------------------------
// 録音やり直し / リセット
// ---------------------------------------------------------------------------
function discardRecording() {
  audioBlob   = null;
  audioChunks = [];
  hide('previewSection');
  resetTimer();
}

function resetRecordUI() {
  audioBlob   = null;
  audioChunks = [];
  hideRecordSections();
  resetTimer();
  document.getElementById('btnRecord').disabled = false;
  document.getElementById('btnStop').disabled   = true;
}

function hideRecordSections() {
  hide('previewSection');
  hide('loadingSection');
  hide('resultSection');
  hide('errorSection');
}

// ---------------------------------------------------------------------------
// タイマー
// ---------------------------------------------------------------------------
function updateTimer() {
  var elapsed = Date.now() - startTime;
  var sec = Math.floor(elapsed / 1000) % 60;
  var min = Math.floor(elapsed / 60000);
  document.getElementById('timer').textContent = pad(min) + ':' + pad(sec);
}

function resetTimer() {
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('timer').classList.remove('recording');
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// ---------------------------------------------------------------------------
// 音声ビジュアライザー
// ---------------------------------------------------------------------------
function setupVisualizer(stream) {
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  ctx.createMediaStreamSource(stream).connect(analyser);

  var canvas    = document.getElementById('visualizer');
  var canvasCtx = canvas.getContext('2d');
  var bufferLen = analyser.frequencyBinCount;
  var dataArray = new Uint8Array(bufferLen);

  function draw() {
    animationId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    canvasCtx.fillStyle = '#fafafa';
    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
    var barWidth = (canvas.width / bufferLen) * 2.5;
    var x = 0;
    for (var i = 0; i < bufferLen; i++) {
      var barHeight = (dataArray[i] / 255) * canvas.height;
      canvasCtx.fillStyle = 'rgba(229,57,53,' + (0.3 + dataArray[i] / 255 * 0.7) + ')';
      canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  }
  draw();
}

// ---------------------------------------------------------------------------
// ヘルパー
// ---------------------------------------------------------------------------
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function showError(msg) {
  document.getElementById('errorMessage').textContent = msg;
  show('errorSection');
}

function formatTimestamp(d) {
  return d.getFullYear()
    + pad(d.getMonth() + 1)
    + pad(d.getDate()) + '_'
    + pad(d.getHours())
    + pad(d.getMinutes())
    + pad(d.getSeconds());
}
</script>
