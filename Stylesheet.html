<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }

  .container {
    max-width: 560px;
    margin: 24px auto;
    padding: 24px 20px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
  }

  .screen {}

  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }

  h2 {
    font-size: 1.05rem;
    margin-bottom: 12px;
    color: #555;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 20px;
  }

  /* --- Name input screen --- */
  .name-input-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .input-name {
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1.1rem;
    width: 200px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .input-name:focus {
    outline: none;
    border-color: #1e88e5;
  }

  .name-list {
    margin-top: 8px;
  }
  .name-list-label {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 8px;
  }
  .name-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .btn-name {
    padding: 8px 16px;
    border: 1px solid #e0e0e0;
    border-radius: 20px;
    background: #fafafa;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-name:hover {
    background: #e3f2fd;
    border-color: #90caf9;
  }

  /* --- Header bar --- */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  .display-name {
    font-weight: 700;
    font-size: 1rem;
  }
  .btn-text {
    background: none;
    border: none;
    color: #1e88e5;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 4px 8px;
  }
  .btn-text:hover { text-decoration: underline; }

  /* --- Tab bar --- */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #e0e0e0;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: #fafafa;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #888;
    transition: background 0.2s, color 0.2s;
  }
  .tab.active {
    background: #1e88e5;
    color: #fff;
  }
  .tab:not(.active):hover {
    background: #f0f0f0;
  }
  .tab-content {}

  /* --- Timer --- */
  .timer {
    font-size: 2.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #333;
    margin-bottom: 16px;
  }
  .timer.recording { color: #e53935; }

  /* --- Buttons --- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-record { background: #e53935; color: #fff; }
  .btn-record:hover:not(:disabled) { background: #c62828; }

  .btn-stop { background: #455a64; color: #fff; }
  .btn-stop:hover:not(:disabled) { background: #37474f; }

  .btn-submit { background: #1e88e5; color: #fff; }
  .btn-submit:hover:not(:disabled) { background: #1565c0; }

  .btn-discard { background: #eee; color: #555; }
  .btn-discard:hover { background: #ddd; }

  .action-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 16px;
  }
  .icon { font-size: 0.75rem; }

  /* --- Visualizer --- */
  .visualizer-container {
    margin: 0 auto;
    width: 100%;
    max-width: 400px;
    height: 80px;
  }
  #visualizer {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    background: #fafafa;
  }

  /* --- Preview --- */
  .preview-section { margin-top: 24px; }
  .preview-section audio {
    width: 100%;
    max-width: 400px;
    margin-top: 8px;
  }

  /* --- Loading --- */
  .loading-section { margin-top: 24px; }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 12px;
    border: 4px solid #ddd;
    border-top-color: #1e88e5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Result --- */
  .result-section { margin-top: 24px; }
  .transcript-box {
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: left;
    white-space: pre-wrap;
    min-height: 60px;
    font-size: 0.95rem;
  }
  .result-meta {
    margin-bottom: 16px;
    font-size: 0.85rem;
  }
  .result-meta a { color: #1e88e5; text-decoration: none; }
  .result-meta a:hover { text-decoration: underline; }
  .separator { margin: 0 8px; color: #ccc; }

  /* --- Error --- */
  .error-section {
    margin-top: 24px;
    padding: 16px;
    background: #fff3f3;
    border: 1px solid #ffcdd2;
    border-radius: 8px;
  }
  .error-section p {
    color: #c62828;
    margin-bottom: 12px;
  }

  /* --- Review tab --- */
  .review-empty {
    padding: 40px 0;
    color: #999;
  }

  .review-list {
    text-align: left;
  }

  .review-date-header {
    font-weight: 700;
    font-size: 0.95rem;
    color: #1e88e5;
    padding: 12px 0 6px;
    border-bottom: 2px solid #e3f2fd;
    margin-bottom: 8px;
    margin-top: 8px;
  }
  .review-date-header:first-child {
    margin-top: 0;
  }

  .review-card {
    background: #f9f9f9;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: box-shadow 0.2s;
  }
  .review-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .review-card-time {
    font-size: 0.8rem;
    font-weight: 600;
    color: #888;
    margin-bottom: 6px;
  }

  .review-card-text {
    font-size: 0.92rem;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #333;
    margin-bottom: 8px;
  }

  .review-card-actions {
    text-align: right;
  }

  .review-link {
    font-size: 0.8rem;
    color: #1e88e5;
    text-decoration: none;
  }
  .review-link:hover { text-decoration: underline; }

  /* --- Utility --- */
  .hidden { display: none !important; }
</style>
