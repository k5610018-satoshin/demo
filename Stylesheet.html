<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }

  .container {
    max-width: 560px;
    margin: 40px auto;
    padding: 32px 24px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }

  h2 {
    font-size: 1.1rem;
    margin-bottom: 12px;
    color: #555;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 28px;
  }

  /* --- Timer --- */
  .timer {
    font-size: 2.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #333;
    margin-bottom: 16px;
  }

  .timer.recording {
    color: #e53935;
  }

  /* --- Buttons --- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-record {
    background: #e53935;
    color: #fff;
  }
  .btn-record:hover:not(:disabled) { background: #c62828; }

  .btn-stop {
    background: #455a64;
    color: #fff;
  }
  .btn-stop:hover:not(:disabled) { background: #37474f; }

  .btn-submit {
    background: #1e88e5;
    color: #fff;
  }
  .btn-submit:hover:not(:disabled) { background: #1565c0; }

  .btn-discard {
    background: #eee;
    color: #555;
  }
  .btn-discard:hover { background: #ddd; }

  .action-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 16px;
  }

  .icon { font-size: 0.75rem; }

  /* --- Visualizer --- */
  .visualizer-container {
    margin: 0 auto;
    width: 100%;
    max-width: 400px;
    height: 80px;
  }

  #visualizer {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    background: #fafafa;
  }

  /* --- Preview --- */
  .preview-section {
    margin-top: 24px;
  }

  .preview-section audio {
    width: 100%;
    max-width: 400px;
    margin-top: 8px;
  }

  /* --- Loading --- */
  .loading-section {
    margin-top: 32px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 12px;
    border: 4px solid #ddd;
    border-top-color: #1e88e5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* --- Result --- */
  .result-section {
    margin-top: 24px;
  }

  .transcript-box {
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: left;
    white-space: pre-wrap;
    min-height: 60px;
    font-size: 0.95rem;
  }

  .result-meta {
    margin-bottom: 16px;
    font-size: 0.85rem;
  }

  .result-meta a {
    color: #1e88e5;
    text-decoration: none;
  }
  .result-meta a:hover { text-decoration: underline; }

  .separator {
    margin: 0 8px;
    color: #ccc;
  }

  /* --- Error --- */
  .error-section {
    margin-top: 24px;
    padding: 16px;
    background: #fff3f3;
    border: 1px solid #ffcdd2;
    border-radius: 8px;
  }

  .error-section p {
    color: #c62828;
    margin-bottom: 12px;
  }

  /* --- Utility --- */
  .hidden { display: none !important; }
</style>
